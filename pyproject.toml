[project]
name = "zoro-ai"
version = "0.1.0"
description = "Zoro AI built purely in Python(FastAPI) + PostgreSQL(Supabase) + OpenRouter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.54",
    "st-social-media-links>=0.1.5",
    "streamlit>=1.64.0",
    "uvicorn>=0.53.0",
]
